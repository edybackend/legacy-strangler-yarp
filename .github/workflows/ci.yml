name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      # Warnings are errors (Directory.Build.props), so analyzers and code style gate the build.
      - run: dotnet build --no-restore -c Release
      # JSON diff, migration rules, gateway end to end through YARP, parity contract between the services, architecture.
      - run: dotnet test --no-build -c Release

  compose:
    name: Three services behind the gateway (Docker Compose)
    runs-on: ubuntu-latest
    needs: [dotnet]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Migrate a route step by step through the real gateway
        run: |
          set -euo pipefail
          g=http://localhost:8080
          docker compose up -d
          for i in $(seq 1 60); do curl -fs $g/health && curl -fs $g/api/customers/1 > /dev/null && break; sleep 2; done
          curl -fs $g/ | grep -q 'Strangler migration'
          served() { curl -fs -D - -o /dev/null "$g$1" | tr -d '\r' | awk 'tolower($1)=="x-served-by:" {print $2}'; }

          [ "$(served /api/customers/1)" = modern ]   # already migrated
          for id in 1 2 3 4 5 6 7 8; do [ "$(served /api/orders/$id)" = legacy ]; done   # shadow
          for i in $(seq 1 20); do [ "$(curl -fs $g/migration/api/routes | jq '.[] | select(.routeId=="orders-read") | .counters.shadowCompared')" -eq 8 ] && break; sleep 1; done
          curl -fs $g/migration/api/routes | jq -c '.[] | {routeId, mode, counters}'
          [ "$(curl -fs $g/migration/api/mismatches | jq length)" -eq 4 ]   # the legacy rounding bug, found by shadow traffic

          curl -fs -X PUT $g/migration/api/routes/orders-read -H 'content-type: application/json' -d '{"mode":"Modern","canaryPercent":0}' > /dev/null
          [ "$(served /api/orders/2)" = modern ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X PUT $g/migration/api/routes/orders-write -H 'content-type: application/json' -d '{"mode":"Shadow","canaryPercent":0}')" = 409 ]
      - if: always()
        run: docker compose logs && docker compose down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; the action builds a "<first>^..HEAD" range that fails on a root commit.
      - name: Scan full git history with gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
